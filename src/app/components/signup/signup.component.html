<section class="main">
  <div class="content-w3ls text-center">
      <img src="../../../assets/img/admin.png" alt="" class="img-responsive">
      <form #f="ngForm">
          <div class="wthree-field">
              <input name="name" id="name" type="text" value="" placeholder="Username" required #name="ngModel" ngModel>
          </div>
          <div class="alert alert-danger" style="border-radius: 35px; padding: 14px 30px;" *ngIf="name.invalid && name.touched"> Your Name is required!</div>
          <div class="wthree-field">
              <input name="email" id="email" type="email" value="" placeholder="Email" required email #email="ngModel" ngModel>
          </div>
          <div class="alert alert-danger" style="border-radius: 35px; padding: 14px 30px;" *ngIf="email.touched && email.errors?.required"> Email is required!</div>
          <div class="alert alert-danger" style="border-radius: 35px; padding: 14px 30px;" *ngIf="email.touched && email.errors?.email"> Your input doesn't match email format!</div>
          <div class="wthree-field">
              <input name="password" id="password" type="Password" placeholder="Password" #password="ngModel" ngModel required minlength="6">
          </div>
          <div class="alert alert-danger" style="border-radius: 35px; padding: 14px 30px;" *ngIf="password.touched && password.errors?.required"> Password is required!</div>
          <div class="alert alert-danger" style="border-radius: 35px; padding: 14px 30px;" *ngIf="password.touched && password.errors?.minlength"> Password should be 6+ characters!</div>
          <div class="wthree-field">
              <input name="passwordConfirm" id="passwordConfirm" type="Password" placeholder="Confirm Password" #passwordConfirm="ngModel" ngModel required>
          </div>
          <div class="alert alert-danger" style="border-radius: 35px; padding: 14px 30px;" *ngIf="passwordConfirm.invalid && passwordConfirm.touched"> Password Confirm is required!</div>
          <div class="alert alert-danger" style="border-radius: 35px; padding: 14px 30px;" *ngIf="passwordConfirm.value !== password.value && passwordConfirm.touched"> Passwords are not identical!</div>
          <div class="wthree-field">
              <input name="address" id="address" type="text" placeholder="Address" #address="ngModel" ngModel required>
          </div>
          <div class="alert alert-danger" style="border-radius: 35px; padding: 14px 30px;" *ngIf="address.invalid && address.touched"> Your Address is required!</div>
          <div class="wthree-field">
              <button type="submit" class="btn" [disabled]="f.invalid || passwordConfirm.value !== password.value" (click)="signup(f)">Sign Up</button>
          </div>
          <div class="alert alert-danger" *ngIf="errorMessage" style="border-radius: 35px; padding: 14px 30px;">{{ errorMessage }}</div>
          <div class="login-bottom">
              <a routerLink="/login" class="">Already have account? Log In</a>
          </div>
      </form>
  </div>
</section>
