<!-- breadcrumb-section -->
<div class="breadcrumb-section breadcrumb-bg">
  <div class="container">
    <div class="row">
      <div class="col-lg-8 offset-lg-2 text-center">
        <div class="breadcrumb-text">
          <p>Fresh and Organic</p>
          <h1>Add New Good</h1>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- end breadcrumb section -->

<div class="container">
  <h1 class="my-4" style="font-family: montserrat;">Dashboard</h1>
  <form #f="ngForm" (ngSubmit)="addNewGood(f)" style="margin-top: 20px;">
    <input type="text" class="form-control" name="name" ngModel placeholder="Name" required style="width: 50%; margin-bottom: 10px;">
    <input type="number" class="form-control" name="price" ngModel placeholder="Price" required style="width: 50%;">
    <input type="file" name="image" required #image> <br><br>
    <input type="submit" value="Add" class="btn-boxed" [disabled]="f.invalid">
  </form>
</div>
