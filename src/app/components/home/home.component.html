<!-- hero area -->
<div class="hero-area hero-bg">
  <div class="container">
    <div class="row">
      <div class="col-lg-9 offset-lg-2 text-center">
        <div class="hero-text">
          <div class="hero-text-tablecell">
            <p class="subtitle">Fresh & Organic</p>
            <h1>Delicious Seasonal Fruits</h1>
            <div class="hero-btns">
              <a routerLink="/about" class="boxed-btn">Know More</a>
              <a routerLink="/contactus" class="bordered-btn">Contact Us</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- end hero area -->
<h1 style="text-align: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin-bottom: 30px;">Our Products</h1>
<div class="container">
  <div class="body">
    <div class="row">
      <div class="col col-12 col-md-6 col-lg-3" *ngFor="let good of goods; index as i">
        <div class="card" style="width: 18rem;">
          <img [src]="good.photoUrl || 'assets/img/products/strawberry.jpg'" class="card-img-top" [alt]="good.name || 'Product Image'" (error)="$event.target.src = 'assets/img/products/strawberry.jpg'">
          <div class="card-body">
            <h5 class="card-title">{{ good.name | titlecase }}</h5>
            <p class="card-text">{{ good.price | currency }}</p>
            <button href="#" class="btn btn-primary" (click)="addToCart(i)" *ngIf="add !== i" style="display: block; width: 100%;">Add to cart</button>
            <div *ngIf="add === i">
              <input type="number" class="form-control" placeholder="Amount (kg)" #amount style="width: auto;">
              <button class="btn btn-primary" (click)="buy(amount.value)" style="display: block; width: 100%;">Buy</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
