<section class="main">
  <div class="content-w3ls text-center">
      <img src="../../../assets/img/admin.png" alt="" class="img-responsive">
      <form #f="ngForm">
          <div class="wthree-field">
              <input name="email" id="email" type="email" value="" placeholder="Email" required email #email="ngModel" ngModel >
          </div>
          <div class="alert alert-danger" style="border-radius: 35px; padding: 14px 30px;" *ngIf="email.touched && email.errors?.required"> Email is required!</div>
          <div class="alert alert-danger" style="border-radius: 35px; padding: 14px 30px;" *ngIf="email.touched && email.errors?.email"> Your input doesn't match email format!</div>
          <div class="wthree-field">
              <input name="password" id="password" type="Password" placeholder="Password" #password="ngModel" ngModel required minlength="6">
          </div>
          <div class="alert alert-danger" style="border-radius: 35px; padding: 14px 30px;" *ngIf="password.touched && password.errors?.required"> Password is required!</div>
          <div class="alert alert-danger" style="border-radius: 35px; padding: 14px 30px;" *ngIf="password.touched && password.errors?.minlength"> Password should be 6+ characters!</div>
          <div class="wthree-field">
              <button type="submit" class="btn" [disabled]="f.invalid" (click)="login(f)">Sign In</button>
          </div>
          <div class="login-bottom">
              <a routerLink="/signup" class="">Create An Account</a>
          </div>
      </form>
  </div>
</section>
